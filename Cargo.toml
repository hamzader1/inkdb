[package]
name = "inkdb"
version = "0.1.0"
edition = "2024"

[dependencies]
rustyline = "18.0.1"
thiserror = "2.0"
ink-debug-macro = { path = "ink-debug-macro", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
debug-instrument = ["ink-debug-macro", "serde", "serde_json"]