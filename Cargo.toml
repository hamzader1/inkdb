[package]
name = "inkdb"
version = "0.1.0"
edition = "2024"
description = "A SQLite compatible relational database engine written in Rust"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hamzader1/inkdb"

[[bin]]
name = "inkdb"
path = "src/main.rs"

[dependencies]
rustyline = "18.0.1"
thiserror = "2.0"


[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
